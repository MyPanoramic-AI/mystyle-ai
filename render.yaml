# MyStyle AI — Render Blueprint
#
# Persistence: Free web services cannot attach disks. Account logins, profiles,
# and private photos live in SQLite under API_DATA_DIR and are wiped on Free
# spin-down unless a paid plan + disk is used. This Blueprint uses starter + a
# 4 GB disk at /var/data. Syncing it will leave Free and incur paid usage.
# Apply only when you intend to keep customer data across restarts.

services:
  - type: web
    name: mystyle-ai
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: mystyle-data
      mountPath: /var/data
      sizeGB: 4
    envVars:
      - key: NODE_VERSION
        value: 24.4.0
      - key: APP_ENV
        value: production
      - key: API_DATA_DIR
        value: /var/data
      - key: API_ALLOWED_ORIGINS
        value: https://mystyle-ai.onrender.com
      - key: APP_PUBLIC_URL
        value: https://mystyle-ai.onrender.com
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: No-Reply@mypanoramic.com
      - key: SMTP_FROM
        value: MyStyle AI <No-Reply@mypanoramic.com>
      - key: SMTP_PASS
        sync: false
      - key: API_ADMIN_TOKEN
        generateValue: true
      # OpenAI personal stylist (server-side only). Set OPENAI_API_KEY in the Dashboard.
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-5-mini
      - key: AI_ALLOW_LIVE
        value: "true"
      - key: AI_MAX_BUDGET_USD
        value: "5"
      - key: AI_MAX_USER_BUDGET_USD
        value: "1"
      - key: AI_MAX_LIVE_REQUESTS
        value: "500"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: AI_MAX_INPUT_TOKENS
        value: "4000"
      - key: AI_TIMEOUT_MS
        value: "20000"
      - key: AI_INPUT_USD_PER_MILLION
        value: "0.25"
      - key: AI_CACHED_INPUT_USD_PER_MILLION
        value: "0.025"
      - key: AI_OUTPUT_USD_PER_MILLION
        value: "2"
      - key: OPENAI_API_KEY
        sync: false
